sh(`<h3>${SV[j.svc][1]} ${esc(j.cn)}</h3><div style="max-height:45vh;overflow:auto">${OUT.replace('<img','<img class=pv')}</div><label>দাম ৳${bn(j.pr||0)} • জমা (৳)<input type=number id=pdn value="${j.pd||0}"></label><button class="btn g" onclick="setPd('${i}')">জমা সেভ</button><label>স্ট্যাটাস<select onchange="setSt('${i}',this.value)">${ST.map(x=>`<option ${x==j.st?'selected':''}>${x}</option>`).join('')}</select></label><button class=btn onclick="prt('${i}')">🖨️ প্রিন্ট / PDF</button><button class="btn r" onclick="delJob('${i}')">ট্রাশে পাঠান</button>`)}

function delJob(i){const k=D.j.findIndex(x=>x.id==i);D.t.unshift({k:'j',o:D.j.splice(k,1)[0]});sv();cl();render()}
boot();
